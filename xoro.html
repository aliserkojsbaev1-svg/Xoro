  if(x.r==="u")return'<div class="msg u">'+esc(x.t)+'</div>';
  if(x.s)return'<div class="msg a"></div>';
  if(x.t==="…")return'<div class="msg a ty">'+TY+'<span>'+(lvl==="Вдумчиво"?M[mi].n+" думает…":"Xoro отвечает…")+'</span></div>';
  return'<div class="msg a">'+esc(x.t)+'<button class="cp" data-cp="'+i+'">Копировать</button></div>'}).join("");
 m.scrollTop=m.scrollHeight;
}
function item(c){return'<div class="it'+(c.id===cur?' on':'')+'" data-id="'+c.id+'"><span>'+esc(c.title)+'</span><button class="'+(c.pin?'p':'')+'" data-pin="'+c.id+'" aria-label="Закрепить"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M9 3h6l-1 6 3 3H7l3-3zM12 12v9"/></svg></button><button data-del="'+c.id+'" aria-label="Удалить"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>'}
function renderList(){
 var q=$("sq").value.toLowerCase();
 var a=chats.filter(function(c){return !c.priv&&c.msgs.length&&c.title.toLowerCase().indexOf(q)>-1}).slice().reverse();
 var pn=a.filter(function(c){return c.pin}),rc=a.filter(function(c){return !c.pin});
 $("list").innerHTML=(pn.length?'<div class="sec">Закреплённые</div>'+pn.map(item).join(""):"")+(rc.length?'<div class="sec">Недавние</div>'+rc.map(item).join(""):"")||'<p class="sec">Здесь появятся ваши чаты</p>';
}
function newChat(priv){var c={id:"c"+Date.now(),title:"Новый чат",msgs:[],priv:!!priv};chats.push(c);cur=c.id;render();renderList()}
function setGhost(on){
 ghost=on;chats=chats.filter(function(c){return !c.priv});
 $("ghost").style.background=on?"var(--accbg)":"";$("ghost").style.color=on?"var(--acc)":"";
 newChat(on);if(on)toast("Приватный чат: история не сохраняется");
}
function toggleSide(){if(wide())$("app").classList.toggle("collapsed");else{var o=$("side").classList.toggle("open");$("shade").classList.toggle("open",o)}}
function closeSide(){if(!wide()){$("side").classList.remove("open");$("shade").classList.remove("open")}}
function sync(){var has=$("inp").value.trim().length>0;$("goI").innerHTML=busy?'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>':has?'<path d="M12 19V5M6 11l6-6 6 6" stroke-width="2.4"/>':'<path d="M5 10v4M9 6v12M13 9v6M17 11v2" stroke-width="2.4"/>';$("inp").style.height="auto";$("inp").style.height=Math.min($("inp").scrollHeight,160)+"px"}
function stop(){
 if(!job)return;
 clearInterval(job.timer);var l=job.c.msgs[job.c.msgs.length-1];
 l.t=job.full||"Остановлено.";l.s=false;busy=false;job=null;save();sync();render();
}
function send(){
 var t=$("inp").value.trim();
 if(tab==="img"){if(!t)return;imgs.unshift(t);$("inp").value="";sync();renderImg();return}
 if(busy){stop();return}
 if(!t){toast("Голосовой режим подключим позже");return}
 var c=find(cur);if(!c){newChat(ghost);c=find(cur)}
 if(!c.msgs.length)c.title=t.slice(0,40);
 c.msgs.push({r:"u",t:t},{r:"a",t:"…"});$("inp").value="";busy=true;sync();render();renderList();
 var j=job={c:c,full:"",timer:null};
 askXoro(c).then(function(a){
  if(job!==j)return;
  j.full=a;var last=c.msgs[c.msgs.length-1];last.s=true;last.t="";render();
  var el=$("main").lastElementChild,m=$("main"),w=a.split(/(\s+)/),i=0,st=Math.max(2,Math.ceil(w.length/90));
  j.timer=setInterval(function(){
   i+=st;
   if(i>=w.length){clearInterval(j.timer);last.s=false;last.t=a;busy=false;job=null;save();sync();render();return}
   el.textContent=w.slice(0,i).join("");m.scrollTop=m.scrollHeight;
  },28);
 });
 save();
}
function hue(s,k){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i)+k)>>>0;return h}
function renderImg(){
 $("inote").style.display=imgs.length?"none":"block";
 $("ig").innerHTML=imgs.map(function(p){var a=hue(p,1)%360,b=(a+90+hue(p,2)%120)%360,x=hue(p,3)%100,y=hue(p,4)%100;
  return'<div><i style="background:radial-gradient(circle at '+x+'% '+y+'%,hsl('+a+',85%,60%),transparent 60%),radial-gradient(circle at '+(100-x)+'% '+(100-y)+'%,hsl('+b+',80%,55%),transparent 65%),#111"></i><span>'+esc(p)+'</span></div>'}).join("");
}
function modelUI(){
 var m=M[mi];
 $("mbtn").innerHTML='<span class="dot" style="background:linear-gradient(135deg,'+m.c+')">'+m.ic+'</span>Xoro <b>'+m.n+'</b><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 9l6 6 6-6"/></svg>';
 $("menu").innerHTML='<div class="mh">ВЫБЕРИТЕ МОДЕЛЬ</div>'+M.map(function(x,i){
  var bars=x.p?'<div class="bars">'+[1,2,3].map(function(k){return'<i class="'+(k<=x.p?'f':'')+'"></i>'}).join("")+'</div>':"";
  return'<button class="mc'+(i===mi?' on':'')+'" data-m="'+i+'"><span class="dot" style="background:linear-gradient(135deg,'+x.c+')">'+x.ic+'</span><span class="tx"><b>'+x.n+'</b><small>'+x.d+'</small></span><span class="mt">'+x.t+bars+'</span></button>'}).join("")+
  '<div class="mh" style="padding-top:10px">СТИЛЬ ОТВЕТА</div><div class="seg">'+["Быстро","Вдумчиво"].map(function(l){return'<button data-l="'+l+'" class="'+(l===lvl?'on':'')+'">'+(l==="Быстро"?"⚡ ":"🧠 ")+l+'</button>'}).join("")+'</div>';
}
function modal(h){$("mod").innerHTML='<div class="card">'+h+'</div>';$("mod").classList.add("open")}
function closeModal(){$("mod").classList.remove("open")}
function niceName(e){var l=String(e).split("@")[0].replace(/[0-9]+$/,"");var p=l.split(/[._\-+]+/).filter(Boolean);if(!p.length)p=[String(e).split("@")[0]];return p.map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(" ").slice(0,24)}
function sha(t){try{return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}catch(x){return Promise.resolve(btoa(unescape(encodeURIComponent(t))))}}
function showAuth(m){
 authMode=m;var r=m==="reg";
 $("auth").innerHTML='<div class="card" style="text-align:center"><div style="width:64px;height:64px;margin:0 auto">'+LOGO.replace("<svg ",'<svg style="width:100%;height:100%" ')+'</div><h3 style="margin-top:8px">Xoro</h3><div class="seg" style="margin:12px 0 4px"><button data-am="login" class="'+(r?"":"on")+'">Вход</button><button data-am="reg" class="'+(r?"on":"")+'">Регистрация</button></div>'+(gReady?'<button class="btn g" data-ac="google" style="display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px"><b style="background:#fff;color:#4285f4;border-radius:50%;width:24px;height:24px;display:grid;place-items:center">G</b>Продолжить через Google</button><p style="margin:6px 0;font-size:13px">или по почте</p>':'')+'<div style="text-align:left"><label>ПОЧТА</label><input id="a_em" type="email" autocomplete="email" placeholder="name@gmail.com"><label>ПАРОЛЬ</label><input id="a_pw" type="password" autocomplete="'+(r?"new-password":"current-password")+'" placeholder="Минимум 6 символов"></div><p id="a_err" style="color:#ff6b6b;min-height:20px;margin:10px 0 0"></p><button class="btn" style="margin-top:6px" data-ac="go">'+(r?"Создать аккаунт":"Войти")+'</button><button class="btn g" data-ac="guest">Продолжить без аккаунта</button><p style="margin-top:14px;font-size:12px">Аккаунт и чаты хранятся только в этом браузере. Настоящую регистрацию с подтверждением почты подключим вместе с сервером.</p></div>';
 $("auth").classList.add("open");
}
function doAuth(){
 var em=$("a_em").value.trim().toLowerCase(),pw=$("a_pw").value,er=$("a_err");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){er.textContent="Введите корректную почту";return}
 if(pw.length<6){er.textContent="Пароль должен быть не короче 6 символов";return}
 var us={};try{us=JSON.parse(ls("xoro_users")||"{}")}catch(x){}
 sha(em+":"+pw).then(function(h){
  if(authMode==="reg"){if(us[em]){er.textContent="Такой аккаунт уже есть, откройте вкладку «Вход»";return}us[em]={h:h};ls("xoro_users",JSON.stringify(us))}
  else{if(!us[em]){er.textContent="Аккаунт не найден. Сначала зарегистрируйтесь";return}if(us[em].h!==h){er.textContent="Неверный пароль";return}}
  ls("xoro_session",em);$("auth").classList.remove("open");start(em);
 });
}
function gLogin(){
 var er=$("a_err");er.textContent="";
 try{firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function(r){
  var u=r.user,em=(u.email||"").toLowerCase();
  ls("xoro_gn_"+em,(u.displayName||"").split(" ")[0]);
  if(u.photoURL)ls("xoro_ph_"+em,u.photoURL);
  ls("xoro_session",em);$("auth").classList.remove("open");start(em);
 }).catch(function(e){er.textContent=e.code==="auth/popup-closed-by-user"?"Окно входа закрыто":e.code==="auth/unauthorized-domain"?"Этот адрес сайта не добавлен в Firebase":"Ошибка входа: "+(e.code||e.message)})}catch(x){er.textContent="Google-вход не подключён"}
}
function start(u){
 if(job)clearInterval(job.timer);job=null;user=u;ghost=false;busy=false;mi=0;lvl="Быстро";cfg=JSON.parse(JSON.stringify(DEF));
 try{var s=JSON.parse(ls("xoro_cfg_"+u)||"{}");for(var k in s)cfg[k]=s[k]}catch(e){}
 if(!cfg.name&&u!=="guest")cfg.name=ls("xoro_gn_"+u)||niceName(u);
 cfg.url=AI.url;cfg.key=AI.key;cfg.model=AI.model;
 try{chats=JSON.parse(ls("xoro_chats_"+u)||"[]")}catch(e){chats=[]}
 chats.forEach(function(c){c.msgs=c.msgs.filter(function(m){return !m.s&&m.t!=="…"})});
 $("ghost").style.background="";$("ghost").style.color="";
 theme();profile();newChat(false);modelUI();sync();setTab("ask");
}
function logout(){try{if(gReady)firebase.auth().signOut()}catch(e){}ls("xoro_session","");closeModal();chats=[];user=null;cur=null;showAuth("login")}
$("auth").onclick=function(e){var t=e.target,m=t.getAttribute("data-am");if(m){showAuth(m);return}var a=t.getAttribute("data-ac");if(a==="guest"){ls("xoro_session","guest");$("auth").classList.remove("open");start("guest")}if(a==="go")doAuth();if(a==="google")gLogin()};
$("auth").onkeydown=function(e){if(e.key==="Enter")doAuth()};
function settings(){modal('<h3>Настройки</h3><label>ПОЧТА</label><p style="margin:0;font-weight:700;color:var(--text)">'+esc(user==="guest"?"Гостевой режим":user)+'</p><label>ИМЯ В ПРИВЕТСТВИИ</label><input id="f_name" maxlength="24" value="'+esc(cfg.name)+'"><label>ТЕМА</label><div class="seg" style="margin:0">'+[["auto","Авто"],["dark","Тёмная"],["light","Светлая"]].map(function(t){return'<button data-th="'+t[0]+'" class="'+(cfg.theme===t[0]?'on':'')+'">'+t[1]+'</button>'}).join("")+'</div><button class="btn" data-a="save">Сохранить</button><button class="btn g" data-a="clear">Очистить историю чатов</button><button class="btn g" data-a="out">'+(user==="guest"?"Войти или зарегистрироваться":"Выйти из аккаунта")+'</button><button class="btn g" data-a="close">Закрыть</button>')}
$("mod").onclick=function(e){
 var t=e.target;if(t===$("mod"))return closeModal();
 var th=t.getAttribute("data-th");if(th){cfg.theme=th;theme();Array.prototype.forEach.call(t.parentNode.children,function(b){b.classList.toggle("on",b===t)});return}
 var a=t.getAttribute("data-a");if(!a)return;
  if(a==="save"){cfg.name=$("f_name").value.trim()||(user==="guest"?"":niceName(user));cfg.asked=true;saveCfg();profile();render();closeModal();toast("Сохранено")}
 if(a==="clear"){if(t.getAttribute("data-s")!=="1"){t.setAttribute("data-s","1");t.textContent="Нажмите ещё раз для подтверждения";return}chats=[];ls("xoro_chats_"+user,"[]");newChat(false);closeModal();toast("История очищена")}
 if(a==="out")logout();
 if(a==="close")closeModal();
};
$("go").onclick=send;$("inp").oninput=sync;
$("inp").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&wide()){e.preventDefault();send()}};
$("burger").onclick=toggleSide;$("fold").onclick=toggleSide;$("shade").onclick=closeSide;
$("new").onclick=function(){if(ghost)setGhost(false);else newChat(false);setTab("ask");closeSide()};
$("srch").onclick=function(){var s=$("sq");var o=s.style.display==="block";s.style.display=o?"none":"block";if(!o)s.focus();else{s.value="";renderList()}};
$("sq").oninput=renderList;
$("gear").onclick=function(){settings();closeSide()};
$("side").onclick=function(e){if(e.target.closest("[data-soon]"))toast("Скоро появится в Xoro")};
$("list").onclick=function(e){
 var p=e.target.closest("[data-pin]");if(p){var c=find(p.getAttribute("data-pin"));c.pin=!c.pin;save();renderList();return}
 var d=e.target.closest("[data-del]");if(d){var id=d.getAttribute("data-del");chats=chats.filter(function(c){return c.id!==id});save();if(cur===id)newChat(false);renderList();return}
 var it=e.target.closest(".it");if(it){if(ghost){ghost=false;$("ghost").style.background="";$("ghost").style.color=""}cur=it.getAttribute("data-id");setTab("ask");render();renderList();closeSide()}
};
$("ghost").onclick=function(){setGhost(!ghost);setTab("ask")};
$("mbtn").onclick=function(e){e.stopPropagation();$("menu").classList.toggle("open")};
$("menu").onclick=function(e){
 e.stopPropagation();
 var m=e.target.closest("[data-m]");if(m){mi=+m.getAttribute("data-m");modelUI();$("menu").classList.remove("open");toast("Модель: "+M[mi].n);return}
 var l=e.target.closest("[data-l]");if(l){lvl=l.getAttribute("data-l");modelUI()}
};
document.addEventListener("click",function(){$("menu").classList.remove("open")});
$("plus").onclick=function(){toast("Загрузку фото и файлов подключим позже")};
$("mic").onclick=function(){toast("Голосовой ввод подключим позже")};
$("main").onclick=function(e){
 var p=e.target.getAttribute("data-p");if(p){$("inp").value=p;sync();send();return}
 var k=e.target.getAttribute("data-cp");if(k!==null){var c=find(cur);try{navigator.clipboard.writeText(c.msgs[+k].t).then(function(){toast("Скопировано")},function(){toast("Не удалось скопировать")})}catch(x){toast("Не удалось скопировать")}}
};
function setTab(t){
 tab=t;Array.prototype.forEach.call($("tabs").children,function(b){b.classList.toggle("on",b.getAttribute("data-t")===t)});
 $("main").style.display=t==="ask"?"flex":"none";$("imgp").style.display=t==="img"?"flex":"none";$("soon").style.display=t==="build"?"block":"none";
 $("dock").style.display=t==="build"?"none":"flex";$("inp").placeholder=t==="img"?"Опишите картинку":"Спросить Xoro";
 if(t==="build")$("soonT").textContent="Сборка";
 if(t==="img")renderImg();
}
$("tabs").onclick=function(e){var t=e.target.getAttribute("data-t");if(t)setTab(t)};
try{if(typeof firebase!=="undefined"&&FB_CFG.apiKey){firebase.initializeApp(FB_CFG);gReady=true}}catch(e){}
var sess=ls("xoro_session");if(sess)start(sess);else showAuth("login");
})();
</script>
</body>
