var PERSONA="Ты Xoro, новая ИИ-модель, созданная разработчиком Zeko. Всегда отвечай как Xoro. Никогда не упоминай другие ИИ-модели и компании (Google, Gemini, OpenAI, ChatGPT, Anthropic, Claude и подобные), даже если спросят напрямую. Если спрашивают, на чём ты основан, как устроен, какая у тебя архитектура или данные обучения, отвечай, что это внутренние детали разработки Zeko, которыми ты не делишься, и предложи помочь с задачей. Не выдумывай технических подробностей о себе. ХАРАКТЕР. 1) Дружелюбный: общаешься спокойно и доброжелательно, никогда не унижаешь за ошибки, можешь поддержать шутку и неформальный разговор. 2) Умный, но не заносчивый: объясняешь сложное простыми словами, не используешь сложные термины без нужды, ошибки пользователя исправляешь мягко. 3) Адаптивный: пользователь пишет коротко, отвечай коротко; просит подробно, объясняй подробно; пишет на русском, отвечай по-русски; просит казахский, отвечай по-казахски; нужен школьный стиль, не пиши как научная статья. 4) Не просто отвечаешь, а помогаешь: вместо «Нет, это неправильно» говори, например: «Почти правильно. Здесь нужно использовать has been, потому что это Present Perfect Continuous». 5) В обычном разговоре можешь быть неформальным («Да, понял», «Смотри, тут всё проще», «Ага, теперь понял, что ты имеешь в виду»), а в официальных текстах стиль автоматически становится серьёзнее. 6) Честный: если чего-то не знаешь или не уверен, не выдумывай ответ, а скажи: «Я не уверен в этом. Давай проверим.» 7) Терпеливый: если человек спрашивает одно и то же несколько раз, объясняй снова, но другим способом. 8) Помнишь, о чём идёт разговор, и не заставляешь пользователя повторять всё заново. ЛИЧНОСТЬ. У тебя свой стиль юмора: лёгкий, иногда с лёгким сарказмом и мемами, но никогда не обидный и не в каждом сообщении. Настроение подстраивай под ситуацию: спокойное, весёлое или серьёзное. Есть несколько характерных выражений («Давай разберёмся», «Смотри, тут всё проще»), но не повторяй их постоянно. Постепенно замечай, какой стиль нравится пользователю (коротко или подробно, формально или нет), и подстраивайся. У тебя нет доступа к интернету и свежим новостям: не говори, что что-то искал в сети, и честно предупреждай, если информация могла устареть. ПРИВЕТСТВИЕ. На простое приветствие («привет», «здравствуй», «hi») отвечай ровно: «Привет! Чем я могу помочь?» (на другом языке эквивалентно, на этом же языке), без имени пользователя и без лишних слов. Не обращайся к пользователю по имени. ЭМОДЗИ. Используй естественно и умеренно: не в каждом предложении, обычно от 0 до 3 на сообщение; в серьёзных, учебных и официальных ответах редко или совсем не используй; не повторяй один и тот же эмодзи слишком часто. Обычный разговор: 🙂 😄 👍. Радость и успех: 🎉 🔥. Объяснение: 💡. Важное предупреждение: ⚠️. Шутка: 😂. Поддержка: ❤️. Технические темы: 🤖 ⚙️. Пиши понятно, Markdown (списки, таблицы, код) используй только когда он помогает.";

/* Markdown */
function md(s){
 var bl=[],h=esc(s);
 function inl(x){return x.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
 h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,function(m,l,c){bl.push("<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");return"\u0001"+(bl.length-1)+"\u0001"});
 h=h.replace(/(?:^\|.*\|[ \t]*(?:\n|$))+/gm,function(blk){
  var rows=blk.trim().split("\n").map(function(r){return r.trim()});
  var body=rows.slice(1).filter(function(r){return !/^\|[\s:\-|]+\|$/.test(r)});
  function cells(r){return r.replace(/^\||\|$/g,"").split("|").map(function(c){return inl(c.trim())})}
  bl.push('<div class="tw"><table><thead><tr>'+cells(rows[0]).map(function(c){return"<th>"+c+"</th>"}).join("")+"</tr></thead><tbody>"+body.map(function(r){return"<tr>"+cells(r).map(function(c){return"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>");
  return"\u0001"+(bl.length-1)+"\u0001\n";
 });
 h=inl(h);
 var out=[],ls2=null;
 function cl(){if(ls2){out.push("</"+ls2+">");ls2=null}}
 h.split("\n").forEach(function(l){
  var m;
  if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(ls2!=="ul"){cl();out.push("<ul>");ls2="ul"}out.push("<li>"+m[1]+"</li>")}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(ls2!=="ol"){cl();out.push("<ol>");ls2="ol"}out.push("<li>"+m[1]+"</li>")}
  else{cl();if(m=l.match(/^#{1,4}\s+(.*)/))out.push("<h4>"+m[1]+"</h4>");else if(!l.trim())out.push('<div class="l"></div>');else out.push("<div>"+l+"</div>")}
 });
 cl();
 return out.join("").replace(/\u0001(\d+)\u0001/g,function(m,i){return bl[i]});
}

function callAI(msgs,mt){
 return fetch(AI.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:AI.model,messages:msgs,max_tokens:mt||1500})})
 .then(function(r){return r.text().then(function(t){
  var d=null;try{d=JSON.parse(t)}catch(e){}
  if(d&&d.choices&&d.choices[0]&&d.choices[0].message)return d.choices[0].message.content||"";
  var e=new Error("http");e.status=r.status;throw e;
 })});
}

  var tx=x.t||(x.dt?"Кратко перескажи документ.":"");

  return{role:"user",content:tx||"(фото)"};
 }));

}

function run(c){
 c.msgs.push({r:"a",t:"…"});busy=true;sync();render();save();
 var j=job={c:c,full:"",timer:null};
 askXoro(c).then(function(a){return{t:a||"Пустой ответ, попробуйте ещё раз.",e:!a}},function(e){return{t:errText(e),e:true}}).then(function(res){
  if(job!==j)return;
  var last=c.msgs[c.msgs.length-1],a=res.t;last.err=res.e;j.full=a;
  if(res.e||!cfg.anim){last.t=a;busy=false;job=null;save();sync();render();return}
  last.s=true;last.t="";render();
  var el=$("main").lastElementChild,m=$("main"),w=a.split(/(\s+)/),i=0,st=Math.max(2,Math.ceil(w.length/90));
  j.timer=setInterval(function(){
   i+=st;
   if(i>=w.length){clearInterval(j.timer);last.s=false;last.t=a;busy=false;job=null;save();sync();render();return}
   el.textContent=w.slice(0,i).join("");m.scrollTop=m.scrollHeight;
  },28);
 });
}

function calc(t){
 if(!/^[\d\s+\-*\/().,^%×÷]+$/.test(t)||!/\d/.test(t)||!/[+\-*\/^×÷]/.test(t))return null;
 if(/^\d{1,4}[-.\/]\d{1,2}[-.\/]\d{1,4}$/.test(t))return null;
 if((t.match(/\d/g)||[]).length>=10&&!/[*\/^×÷]/.test(t))return null;
 var ex=t.replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,".").replace(/\^/g,"**").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
 try{var r=Function('"use strict";return ('+ex+')')();if(typeof r==="number"&&isFinite(r))return String(Math.round(r*1e10)/1e10)}catch(e){}
 return null;
}

$("plus").onclick=function(e){e.stopPropagation();$("menu").classList.remove("open");renderPM();$("pm").classList.toggle("open")};
$("pm").onclick=function(e){
 e.stopPropagation();
 var b=e.target.closest("button");if(!b)return;
 var a=b.getAttribute("data-pm"),keep=false;
 if(a==="file")$("file").click();
 else if(a==="cam")$("cam").click();
 else if(a==="doc")$("doc").click();
 else if(a==="img"){imgMode=!imgMode;tool=null;toast(imgMode?"Опишите картинку и отправьте":"Режим картинок выключен")}
 else if(a==="mem"){tool={id:"mem",n:"🧠 Запомнить",ph:"Что мне запомнить?"};imgMode=false}
 else if(a==="memlist")memModal();
 else if(a==="ah"){cfg.ah=!cfg.ah;saveCfg();keep=true}
 else if(b.hasAttribute("data-md")){cfg.md=+b.getAttribute("data-md");saveCfg();keep=true}
 else if(b.hasAttribute("data-ch")){cfg.ch=+b.getAttribute("data-ch");saveCfg();keep=true;toast("Персонаж: "+CH[cfg.ch].n)}
 else if(b.hasAttribute("data-fm")){cfg.fm=+b.getAttribute("data-fm");saveCfg();keep=true}
 else if(b.hasAttribute("data-tl")){var id=b.getAttribute("data-tl");tool=TL.filter(function(x){return x.id===id})[0];imgMode=false}
 renderChips();
 if(keep)renderPM();else $("pm").classList.remove("open");
};

$("cam").onchange=function(){loadImg(this.files[0]);this.value=""};

 renderChips();
};

 var c=find(cur),b;
 if(b=e.target.closest("[data-cp]"))copyText(c.msgs[+b.getAttribute("data-cp")].t);
 if(b=e.target.closest("[data-sp]"))speak(c.msgs[+b.getAttribute("data-sp")].t);
 if(b=e.target.closest("[data-dl]"))dl(c.msgs[+b.getAttribute("data-dl")].t);
 if(b=e.target.closest("[data-io]"))window.open(imgUrl(c.msgs[+b.getAttribute("data-io")].img),"_blank");
 if(b=e.target.closest("[data-ia]")){var im=c.msgs[+b.getAttribute("data-ia")].img;im.s=Math.floor(Math.random()*1e6);save();render()}
 if(e.target.closest("[data-rt]"))retry();
};
